name: Build MattzLauncher APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build APK (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [ "all", "arm64", "arm" ]
      fail-fast: false

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK & NDK
        run: |
          echo "Installing Android SDK platforms and NDK 25.2.9519653..."
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"

      - name: Grant Executable Permissions to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build JRE LWJGL3 Classes
        run: ./gradlew jre_lwjgl3glfw:build --no-daemon --stacktrace

      - name: Build MattzLauncher (${{ matrix.arch }})
        env:
          ZL_BUILD_TYPE: "RELEASE"
        run: ./gradlew MattzLauncher:assembleDebug -Darch=${{ matrix.arch }} --no-daemon --stacktrace

      - name: Upload MattzLauncher APK (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: MattzLauncher-${{ matrix.arch }}-APK
          path: MattzLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
